spring:
  application:
    name: mytasknote-api
  datasource:
    url: jdbc:mysql://localhost:3307/mytasknote?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: appuser
    password: apppass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
server:
  port: 8080
